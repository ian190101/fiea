name: Tests

on:
  push:
    branches:
      - main
      - master
      - '*.x'
  pull_request:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: [8.2, 8.3, 8.4]

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, dom, curl, gd, libxml, mbstring, sodium, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Preparar Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Instalar y compilar frontend
        run: npm ci && npm run build

      - name: Verificar utilidades frontend
        run: node --test tests/Frontend/*.test.mjs

      - name: Execute tests
        run: mkdir -p build && vendor/bin/phpunit --log-junit build/phpunit.xml

      - name: Publicar diagnóstico de pruebas
        if: failure()
        run: php .github/scripts/reportar-pruebas.php build/phpunit.xml
